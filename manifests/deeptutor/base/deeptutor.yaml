---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-iscsi-deeptutor-data
  labels:
    app: deeptutor
spec:
  storageClassName: "freenas-iscsi-manual-csi"
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: org.democratic-csi.node-manual
    readOnly: false
    fsType: xfs
    volumeHandle: pv-iscsi-deeptutor-data
    volumeAttributes:
      portal: 10.10.30.43:3260
      iqn: iqn.2005-10.org.freenas.ctl:deeptutor-data
      lun: "0"
      node_attach_driver: iscsi
      provisioner_driver: node-manual

---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: pvc-iscsi-deeptutor-data
  labels:
    app: deeptutor
spec:
  storageClassName: freenas-iscsi-manual-csi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  volumeName: pv-iscsi-deeptutor-data

---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: deeptutor
  labels:
    app: deeptutor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deeptutor
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: deeptutor
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        # Backend and frontend as separate containers (no supervisord). Same pod
        # network namespace — frontend proxies /api to 127.0.0.1:8001.
        - name: backend
          image: docker.io/jetri/deeptutor:1.4.10
          imagePullPolicy: Always
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          command: ["/bin/bash", "/app/start-backend.sh"]
          env:
            - name: PYTHONPATH
              value: "/app"
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: backend
              containerPort: 8001
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /app/data
          startupProbe:
            httpGet:
              path: /
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 8001
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "3Gi"
              cpu: "2000m"
        - name: frontend
          image: docker.io/jetri/deeptutor:1.4.10
          imagePullPolicy: Always
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          # Load runtime JSON settings the same way the image entrypoint does,
          # then run the stock frontend start script.
          command:
            - /bin/bash
            - -ec
            - |
              export DEEPTUTOR_IGNORE_PROCESS_ENV_OVERRIDES=1
              eval "$(python - <<'PY'
              import shlex
              from deeptutor.services.config import export_runtime_settings_to_env
              for key, value in export_runtime_settings_to_env(overwrite=True).items():
                  print(f"export {key}={shlex.quote(str(value))}")
              PY
              )"
              export DEEPTUTOR_API_BASE_URL="${DEEPTUTOR_API_BASE_URL:-http://127.0.0.1:${BACKEND_PORT:-8001}}"
              exec /app/start-frontend.sh
          ports:
            - name: frontend
              containerPort: 3782
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /app/data
          startupProbe:
            httpGet:
              path: /
              port: 3782
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3782
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 3782
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      restartPolicy: Always
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pvc-iscsi-deeptutor-data

---
kind: Service
apiVersion: v1
metadata:
  name: deeptutor-svc
  labels:
    app: deeptutor
spec:
  type: ClusterIP
  selector:
    app: deeptutor
  ports:
    - name: frontend
      protocol: TCP
      port: 3782
      targetPort: frontend
    - name: backend
      protocol: TCP
      port: 8001
      targetPort: backend

---
kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: deeptutor
  labels:
    app: deeptutor
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - tutor.j3laserna.me
      secretName: wildcard-j3laserna-me-tls
  rules:
    - host: tutor.j3laserna.me
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: deeptutor-svc
                port:
                  name: backend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deeptutor-svc
                port:
                  name: frontend
