---
apiVersion: v1
kind: ConfigMap
metadata:
  name: deeptutor-supervisor
  labels:
    app: deeptutor
data:
  # Same as the upstream image config except pidfile=/tmp — UID 1000 cannot
  # write /var/run in Kubernetes. /tmp is world-writable in the base image.
  deeptutor.conf: |
    [supervisord]
    nodaemon=true
    logfile=/dev/null
    logfile_maxbytes=0
    pidfile=/tmp/supervisord.pid

    [program:backend]
    command=/bin/bash /app/start-backend.sh
    directory=/app
    autostart=true
    autorestart=true
    stdout_logfile=/dev/fd/1
    stdout_logfile_maxbytes=0
    stderr_logfile=/dev/fd/2
    stderr_logfile_maxbytes=0
    environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"

    [program:frontend]
    command=/bin/bash /app/start-frontend.sh
    directory=/app/web
    autostart=true
    autorestart=true
    startsecs=5
    stdout_logfile=/dev/fd/1
    stdout_logfile_maxbytes=0
    stderr_logfile=/dev/fd/2
    stderr_logfile_maxbytes=0
    environment=NODE_ENV="production"
