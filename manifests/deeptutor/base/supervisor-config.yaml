---
apiVersion: v1
kind: ConfigMap
metadata:
  name: deeptutor-supervisor
  labels:
    app: deeptutor
data:
  # K8s-specific supervisord config. The upstream image entrypoint drops to UID
  # 1000 before supervisord, but /dev/fd/1 and /dev/fd/2 are not writable after
  # that user switch — dispatchers fail with EACCES. We run supervisord as root
  # (see deployment command) and drop to deeptutor per program instead.
  deeptutor.conf: |
    [supervisord]
    nodaemon=true
    logfile=/dev/null
    logfile_maxbytes=0
    pidfile=/tmp/supervisord.pid

    [program:backend]
    user=deeptutor
    command=/bin/bash /app/start-backend.sh
    directory=/app
    autostart=true
    autorestart=true
    stdout_logfile=/dev/fd/1
    stdout_logfile_maxbytes=0
    stderr_logfile=/dev/fd/2
    stderr_logfile_maxbytes=0
    environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"

    [program:frontend]
    user=deeptutor
    command=/bin/bash /app/start-frontend.sh
    directory=/app/web
    autostart=true
    autorestart=true
    startsecs=5
    stdout_logfile=/dev/fd/1
    stdout_logfile_maxbytes=0
    stderr_logfile=/dev/fd/2
    stderr_logfile_maxbytes=0
    environment=NODE_ENV="production"
